[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-architect-challenge"
version = "0.1.0"
description = "Support-email triage agent, a robust scrape-and-summarize pipeline, and a document Q&A agent with memory and tool use."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "langchain-openai>=1.0",
    "rank-bm25>=0.2.2",
    "pypdf>=4.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
aac = "aac.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running LLM (deselected by default)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long prompt strings; `ruff format` handles code width
